
name: Release Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create ZIP package
        run: |
          TAG="${GITHUB_REF_NAME}"
          PACKAGE="Trabalho_devops-${TAG}.zip"

          git archive \
            --format=zip \
            --prefix="Trabalho_devops-${TAG}/" \
            "$TAG" \
            -o "$PACKAGE"

          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"

      - name: Upload ZIP to existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" "$PACKAGE" --clobber
